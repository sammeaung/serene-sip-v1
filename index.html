<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cherry Pink Valentine Flowers</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-dark: #15050f;
        --pink-1: #ff6fae;
        --pink-2: #ff8fc1;
        --pink-3: #ffd0e6;
        --stem: #c33b7a;
        --leaf: #d96a99;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 20%, #5a1336 0%, #2a0a1a 40%, var(--bg-dark) 75%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .night {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 50% 25%, rgba(255, 120, 180, 0.4), transparent 45%),
          radial-gradient(circle at 20% 80%, rgba(255, 80, 140, 0.16), transparent 35%),
          radial-gradient(circle at 80% 85%, rgba(255, 100, 160, 0.16), transparent 35%);
        filter: blur(0.2vmin);
      }

      .valentine-message {
        position: fixed;
        top: 7vh;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        color: #ffe8f3;
        text-shadow: 0 0 12px rgba(255, 120, 190, 0.8), 0 0 28px rgba(255, 90, 160, 0.5);
        z-index: 30;
        pointer-events: none;
      }

      .valentine-message h1 {
        font-size: clamp(1.8rem, 4vw, 3rem);
        letter-spacing: 1px;
        margin-bottom: 0.35rem;
      }

      .valentine-message p {
        font-size: clamp(1rem, 2vw, 1.35rem);
      }

      .flowers {
        position: relative;
        width: min(95vw, 1100px);
        height: 82vh;
        transform: scale(0.95);
        z-index: 10;
      }

      .flower {
        position: absolute;
        bottom: 4vmin;
        transform-origin: bottom center;
        animation: sway 4s ease-in-out infinite;
      }

      .flower .stem {
        width: 1.3vmin;
        height: var(--stem-h, 52vmin);
        margin: 0 auto;
        background: linear-gradient(to top, #7a1f49, var(--stem));
        border-radius: 1vmin;
      }

      .flower .bloom {
        position: absolute;
        left: 50%;
        top: calc(-1 * var(--bloom-y, 7vmin));
        transform: translateX(-50%);
        width: 14vmin;
        height: 14vmin;
      }

      .petal {
        position: absolute;
        width: 7.4vmin;
        height: 10vmin;
        left: 50%;
        bottom: 50%;
        transform-origin: bottom center;
        border-radius: 60% 60% 40% 40%;
        background: linear-gradient(to top, var(--pink-1), var(--pink-3));
        box-shadow: inset 0 0 1.8vmin rgba(255, 255, 255, 0.35), 0 0 1.2vmin rgba(255, 105, 170, 0.4);
      }

      .petal.p1 { transform: translate(-50%, 10%) rotate(0deg); }
      .petal.p2 { transform: translate(-50%, 10%) rotate(45deg); }
      .petal.p3 { transform: translate(-50%, 10%) rotate(90deg); }
      .petal.p4 { transform: translate(-50%, 10%) rotate(135deg); }
      .petal.p5 { transform: translate(-50%, 10%) rotate(180deg); }
      .petal.p6 { transform: translate(-50%, 10%) rotate(225deg); }
      .petal.p7 { transform: translate(-50%, 10%) rotate(270deg); }
      .petal.p8 { transform: translate(-50%, 10%) rotate(315deg); }

      .center {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 4vmin;
        height: 4vmin;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff7fb, #ffb7d7 70%);
        box-shadow: 0 0 1.2vmin rgba(255, 180, 220, 0.8);
      }

      .leaf {
        position: absolute;
        width: 7vmin;
        height: 3.2vmin;
        border-radius: 100% 0 100% 0;
        background: linear-gradient(to right, #a0295f, var(--leaf));
        box-shadow: inset 0 0 1vmin rgba(255, 255, 255, 0.18);
      }

      .leaf.l1 { left: 50%; bottom: 26vmin; transform: rotate(24deg); }
      .leaf.l2 { right: 50%; bottom: 17vmin; transform: scaleX(-1) rotate(14deg); }
      .leaf.l3 { left: 50%; bottom: 9vmin; transform: rotate(-10deg); }

      .flower.f1 { left: 11%; --stem-h: 48vmin; --bloom-y: 8vmin; animation-delay: 0s; }
      .flower.f2 { left: 22%; --stem-h: 58vmin; --bloom-y: 8vmin; animation-delay: .4s; }
      .flower.f3 { left: 34%; --stem-h: 52vmin; --bloom-y: 8vmin; animation-delay: .8s; }
      .flower.f4 { left: 46%; --stem-h: 60vmin; --bloom-y: 9vmin; animation-delay: 1.1s; }
      .flower.f5 { left: 58%; --stem-h: 50vmin; --bloom-y: 8vmin; animation-delay: 1.4s; }
      .flower.f6 { left: 70%; --stem-h: 57vmin; --bloom-y: 9vmin; animation-delay: 1.7s; }
      .flower.f7 { left: 82%; --stem-h: 49vmin; --bloom-y: 8vmin; animation-delay: 2s; }

      .floating-hearts {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 20;
      }

      .heart {
        position: absolute;
        bottom: -10vmin;
        width: var(--size, 2.2vmin);
        height: var(--size, 2.2vmin);
        transform: rotate(-45deg);
        background: #ff234f;
        opacity: 0.85;
        filter: drop-shadow(0 0 8px rgba(255, 35, 79, 0.65));
        animation: rise var(--dur, 8s) linear infinite;
        animation-delay: var(--delay, 0s);
        left: var(--x, 50%);
      }

      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: inherit;
        border-radius: 50%;
      }

      .heart::before {
        top: -50%;
        left: 0;
      }

      .heart::after {
        top: 0;
        left: 50%;
      }

      .ground-glow {
        position: absolute;
        left: 50%;
        bottom: -10vmin;
        transform: translateX(-50%);
        width: 90vmin;
        height: 26vmin;
        background: radial-gradient(ellipse at center, rgba(255, 90, 165, 0.5), transparent 65%);
        z-index: 2;
        filter: blur(1.4vmin);
      }

      @keyframes sway {
        0%, 100% { transform: rotate(2deg); }
        50% { transform: rotate(-2deg); }
      }

      @keyframes rise {
        0% { transform: translateY(0) translateX(0) scale(0.7) rotate(-45deg); opacity: 0; }
        10% { opacity: 0.85; }
        50% { transform: translateY(-45vh) translateX(2vmin) scale(1) rotate(-45deg); }
        100% { transform: translateY(-95vh) translateX(-2vmin) scale(1.12) rotate(-45deg); opacity: 0; }
      }

      .not-loaded * {
        animation-play-state: paused !important;
      }
    </style>
  </head>
  <body class="not-loaded">
    <div class="night"></div>

    <div class="valentine-message">
      <h1>Happy Valentine&apos;s Day!</h1>
      <p>Thank you for being my date.</p>
    </div>

    <div class="floating-hearts" aria-hidden="true">
      <div class="heart" style="--x: 8%; --dur: 9s; --delay: 0s; --size: 1.8vmin"></div>
      <div class="heart" style="--x: 15%; --dur: 8.1s; --delay: 1.2s; --size: 2.3vmin"></div>
      <div class="heart" style="--x: 24%; --dur: 7.4s; --delay: 0.5s; --size: 2.1vmin"></div>
      <div class="heart" style="--x: 35%; --dur: 8.8s; --delay: 2s; --size: 2.8vmin"></div>
      <div class="heart" style="--x: 44%; --dur: 7.9s; --delay: 1.5s; --size: 2vmin"></div>
      <div class="heart" style="--x: 54%; --dur: 9.6s; --delay: 2.4s; --size: 2.5vmin"></div>
      <div class="heart" style="--x: 62%; --dur: 7.8s; --delay: .7s; --size: 1.9vmin"></div>
      <div class="heart" style="--x: 71%; --dur: 8.6s; --delay: 1.8s; --size: 2.7vmin"></div>
      <div class="heart" style="--x: 81%; --dur: 7.2s; --delay: 0.4s; --size: 2.2vmin"></div>
      <div class="heart" style="--x: 90%; --dur: 9.1s; --delay: 2.1s; --size: 2.4vmin"></div>
    </div>

    <div class="flowers">
      <div class="ground-glow"></div>

      <div class="flower f1"><div class="bloom"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div><div class="petal p7"></div><div class="petal p8"></div><div class="center"></div></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div></div>
      <div class="flower f2"><div class="bloom"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div><div class="petal p7"></div><div class="petal p8"></div><div class="center"></div></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div></div>
      <div class="flower f3"><div class="bloom"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div><div class="petal p7"></div><div class="petal p8"></div><div class="center"></div></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div></div>
      <div class="flower f4"><div class="bloom"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div><div class="petal p7"></div><div class="petal p8"></div><div class="center"></div></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div></div>
      <div class="flower f5"><div class="bloom"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div><div class="petal p7"></div><div class="petal p8"></div><div class="center"></div></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div></div>
      <div class="flower f6"><div class="bloom"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div><div class="petal p7"></div><div class="petal p8"></div><div class="center"></div></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div></div>
      <div class="flower f7"><div class="bloom"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div><div class="petal p7"></div><div class="petal p8"></div><div class="center"></div></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div></div>
    </div>

    <script>
      onload = () => {
        const c = setTimeout(() => {
          document.body.classList.remove("not-loaded");
          clearTimeout(c);
        }, 700);
      };
    </script>
  </body>
</html>
